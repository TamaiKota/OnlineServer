<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ムニキング</title>

    <style>

        body {
            margin: 0;
            background: #101820;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        #password_screen {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;
        }

        #password_screen h1 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        #password_input {
            width: 300px;
            padding: 15px;

            font-size: 18px;

            box-sizing: border-box;
        }

        #password_button {
            width: 300px;

            margin-top: 15px;
            padding: 15px;

            font-size: 18px;

            cursor: pointer;
        }

        #error_message {
            margin-top: 20px;

            color: #ff5555;

            font-size: 16px;
        }

    </style>

</head>

<body>

    <div id="password_screen">

        <h1>ムニキング</h1>

        <input
            id="password_input"
            type="password"
            placeholder="パスワードを入力"
        >

        <button
            id="password_button"
        >
            ゲームを開始
        </button>

        <div id="error_message"></div>

    </div>

    <script>

        const PASSWORD = "AkitaMinami62";

        const passwordInput =
            document.getElementById(
                "password_input"
            );

        const passwordButton =
            document.getElementById(
                "password_button"
            );

        const errorMessage =
            document.getElementById(
                "error_message"
            );


        passwordButton.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.value
                    === PASSWORD
                ) {

                    window.location.href =
                        "./ムニキング.html";

                } else {

                    errorMessage.textContent =
                        "パスワードが違います。";

                    passwordInput.value = "";

                }

            }
        );


        passwordInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key
                    === "Enter"
                ) {

                    passwordButton.click();

                }

            }
        );

    </script>

</body>

</html>
